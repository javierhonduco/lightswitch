[package]
name = "lightswitch-metadata"
version = "0.2.3"
edition = "2021"
description = "Provides metadata used by profilers and debuggers"
license = "MIT"
repository = "https://github.com/javierhonduco/lightswitch"

[features]
default = []
kubernetes = ["dep:futures", "dep:k8s-openapi", "dep:kube", "dep:tokio"]

[dependencies]
lru = "0.16.3"
nix = { workspace = true }
anyhow = { workspace = true }
procfs = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
futures = { version = "0.3", optional = true }
k8s-openapi = { version = "0.27.1", features = ["latest"], optional = true }
kube = { version = "3.0.1", default-features = false, features = ["runtime", "client", "derive", "rustls-tls", "aws-lc-rs"], optional = true }
tokio = { version = "1", features = ["rt", "time", "macros"], optional = true }
mini-moka = "0.10"
